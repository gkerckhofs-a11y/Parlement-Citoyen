name: Publication Firebase
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/firebase-production.yml', 'public/**']
    tags: ['publication-*']
permissions:
  contents: read
  id-token: write
concurrency:
  group: parlement-firebase-production
  cancel-in-progress: false
jobs:
  verify-access:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: projects/1055602103191/locations/global/workloadIdentityPools/parlement-github/providers/github
          service_account: publication-firebase@parlement-citoyen.iam.gserviceaccount.com
      - uses: google-github-actions/setup-gcloud@v2
      - name: Vérifier les droits effectifs sur les ressources de production
        shell: bash
        run: |
          set -euo pipefail
          project=parlement-citoyen
          token=$(gcloud auth print-access-token)
          check_permissions() {
            local url="$1" required="$2" response
            response=$(curl --fail-with-body -sS -H "Authorization: Bearer $token" -H 'Content-Type: application/json' --data "$(jq -nc --argjson p "$required" '{permissions:$p}')" "$url")
            jq -e --argjson required "$required" '($required - (.permissions // [])) == []' <<< "$response"
          }
          check_permissions "https://cloudresourcemanager.googleapis.com/v1/projects/$project:testIamPermissions" '["firebasehosting.sites.update","cloudfunctions.functions.update","firebaserules.rulesets.create","firebaserules.releases.update","serviceusage.services.use"]'
          runtime=$(gcloud functions describe parliament --gen2 --region=europe-west1 --project="$project" --format='value(serviceConfig.serviceAccountEmail)')
          check_permissions "https://iam.googleapis.com/v1/projects/$project/serviceAccounts/$runtime:testIamPermissions" '["iam.serviceAccounts.actAs"]'
  deploy:
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/publication-') || (github.ref == 'refs/heads/main' && startsWith(github.event.head_commit.message, '[publier]'))
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Vérifier la provenance de la version
        run: git merge-base --is-ancestor HEAD origin/main
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci --prefix functions && npm test
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: projects/1055602103191/locations/global/workloadIdentityPools/parlement-github/providers/github
          service_account: publication-firebase@parlement-citoyen.iam.gserviceaccount.com
      - uses: google-github-actions/setup-gcloud@v2
      - name: Mettre à jour la fonction de deuxième génération
        if: "!contains(github.event.head_commit.message, '[hosting]')"
        run: |
          gcloud functions deploy parliament --gen2 --project=parlement-citoyen --region=europe-west1 --runtime=nodejs22 --entry-point=parliament --trigger-http --source=functions --quiet
      - run: npx --yes firebase-tools@14.27.0 deploy --project parlement-citoyen --only "${{ contains(github.event.head_commit.message, '[hosting]') && 'hosting' || 'firestore:rules,hosting' }}" --non-interactive
      - name: Vérifier le site et son API
        run: |
          curl -fsS https://parlement-citoyen.web.app/ -o /tmp/parlement.html
          grep -q 'Parlement citoyen' /tmp/parlement.html
          curl -sS -H 'Content-Type: application/json' --data '{}' https://parlement-citoyen.web.app/api/view -o /tmp/parlement-api.json
          node -e "if (!require('/tmp/parlement-api.json').error) process.exit(1)"
